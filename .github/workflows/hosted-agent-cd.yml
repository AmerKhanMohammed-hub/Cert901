name: Azure AI Foundry Agent Smoke Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-agent:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install AI SDK Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install azure-ai-projects azure-identity

    - name: Execute Agent Smoke Test
      env:
        AZURE_AIPROJECT_CONNECTION_STRING: ${{ secrets.AZURE_AIPROJECT_CONNECTION_STRING }}
        AZURE_AI_AGENT_ID: ${{ secrets.AZURE_AI_AGENT_ID }}
      run: |
        python test_agent.py
