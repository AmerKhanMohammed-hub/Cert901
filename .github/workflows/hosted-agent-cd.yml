name: Azure AI Foundry Agent Multi-Agent Orchestration

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual execution directly from the GitHub Actions UI

permissions:
  id-token: write  # Critical: Required for requesting the OIDC JWT token from Azure Entra ID
  contents: read   # Required to check out your repository code files

jobs:
  orchestrate-agents:
    runs-on: ubuntu-22.04
    steps:
    
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login via OIDC Federated Identity
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Modern Azure AI SDK Dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs the core Azure AI Projects SDK framework
        pip install azure-ai-projects azure-identity

    - name: Step 1 - Programmatically Deploy New Agent Prompt
      env:
        AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
        AZURE_AI_AGENT_ID: ${{ secrets.AZURE_AI_AGENT_ID }}
      run: |
        # Fixed script using modern constructor parameters to prevent connection string crashes
        python update_agent_prompt.py

    - name: Step 2 - Execute Multi-Agent Supervisor Orchestration
      env:
        AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
        AZURE_AI_AGENT_ID: ${{ secrets.AZURE_AI_AGENT_ID }}
      run: |
        # Drives the supervisor-worker orchestration pattern to cross-reference data sources
        python supervisor_orchestrator.py
